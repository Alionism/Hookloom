name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy Persian font
        run: node scripts/copy-fonts.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons and splash
        run: node scripts/make-icons.js

      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hookloom.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hookloom-apk
          path: Hookloom.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hookloom build ${{ github.run_number }}
          body: |
            APK قابل نصب اپلیکیشن هوک‌لوم (نسخه Debug-signed).
            فایل Hookloom.apk را دانلود و روی اندروید نصب کنید.
          files: Hookloom.apk
